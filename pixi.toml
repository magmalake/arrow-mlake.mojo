[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "arrow-mlake.mojo"
version = "0.4.1"
description = "The Apache Arrow memory layout, the C Data Interface and IPC streams, in pure Mojo — a stopgap until marrow builds on Mojo 1.x."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tasks]
# Pure Mojo, no FFI and no tin dependencies — consumers just
# `-I ../arrow-mlake.mojo/src`.
test = { cmd = "mkdir -p build && mojo build tests/arrow_mlake_test.mojo -I src -I tests -I ../memory-region.mojo/src -o build/arrow-mlake-test && ./build/arrow-mlake-test && mojo build tests/ipc_test.mojo -I src -I tests -I ../memory-region.mojo/src -o build/ipc-test && ./build/ipc-test" }

# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
lint = { cmd = "mojolint --lsp -I src -I tests -I ../memory-region.mojo/src src tests" }
lint-tools = { cmd = "mojolint --lsp -I src -I tests -I ../memory-region.mojo/src tools" }
check = { depends-on = ["test", "lint", "lint-tools"] }

# Per-row import cost, copying against borrowing (tools/bench_import.mojo).
bench-import = { cmd = "mkdir -p build && mojo build -O3 tools/bench_import.mojo -I src -I ../memory-region.mojo/src -o build/bench-import && ./build/bench-import" }

fmt = { cmd = "mojo format src tests tools" }
# `mojo format` has no check mode in 1.1.0 — it rejects `--check` outright — so
# the check is: format, then assert the tree did not move. It rewrites the
# files as a side effect, which is what CI wants and is harmless locally; run
# it with your own work committed or stashed.
format-check = { cmd = "mojo format src tests tools && git diff --exit-code -- src tests tools" }

# The cross-language gate. pyarrow builds the arrays, `_export_to_c` hands them
# over, and tools/carrow_import.mojo imports them — so the producer under test
# is one we did not write, which is the whole point: an importer checked only
# against our own exporter proves the two agree and nothing else. The same
# entry points re-export what they imported, so the *export* side is gated
# here too, by pyarrow comparing what comes back with what it sent.
# macOS wants .dylib, Linux .so; the task reads $SHLIB_EXT.
carrow-import-lib = { cmd = "mkdir -p build && mojo build --emit shared-lib tools/carrow_import.mojo -I src -I ../memory-region.mojo/src -o build/libamcimport$SHLIB_EXT" }
verify-c-import = { cmd = "bash tools/verify_c_import.sh", depends-on = ["carrow-import-lib"] }

# The same gate, the other way round: Mojo produces an ArrowArrayStream and
# pyarrow drains it. `verify-c-import` covers one array at a time; a stream is
# a sequence with its own ownership rules — who frees a batch the consumer
# never asked for — so it needs its own check against a real consumer.
carrow-stream-lib = { cmd = "mkdir -p build && mojo build --emit shared-lib tools/carrow_stream_export.mojo -I src -I ../memory-region.mojo/src -o build/libamcstream$SHLIB_EXT" }
verify-c-stream = { cmd = "bash tools/verify_c_stream.sh", depends-on = ["carrow-stream-lib"] }

# Arrow IPC against pyarrow, both ways: pyarrow reads the streams this writes,
# and this reads the streams pyarrow writes, every type and sliced batches
# included. See tools/verify_ipc.py.
ipc-roundtrip = { cmd = "mkdir -p build && mojo build tools/ipc_roundtrip.mojo -I src -I tests -I ../memory-region.mojo/src -o build/ipc-roundtrip" }
verify-ipc = { cmd = "bash tools/verify_ipc.sh", depends-on = ["ipc-roundtrip"] }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is arrow-mlake-mojo; the Mojo import is
# `from arrow_mlake import …`.
[package]
name = "arrow-mlake-mojo"
version = "0.4.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/arrow_mlake"
name = "arrow_mlake"
extra-args = ["-I", "$PREFIX/lib/mojo"]

[package.host-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"
# The export block is a `Bump` over a `Region` now. Declared here as well as on
# the include path, because a consumer taking the built package needs the
# tin's .mojoc on its own import path.
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "31bda02fa429496e064d764d2d4039160f77e1af" }

[package.build-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"

[package.run-dependencies]
mojo-compiler = "==1.3.0.dev2026112505"
memory-region-mojo = { git = "https://github.com/magmalake/memory-region.mojo", rev = "31bda02fa429496e064d764d2d4039160f77e1af" }

[target.osx-arm64.activation.env]
SHLIB_EXT = ".dylib"

[target.linux-64.activation.env]
SHLIB_EXT = ".so"

[target.linux-aarch64.activation.env]
SHLIB_EXT = ".so"

# One toolchain: the tin, its tests and every consumer use the same Mojo
# nightly. A precompiled Mojo package (.mojoc) loads only in the compiler
# version that built it, so the pin is exact here and in [package] above, and
# it moves across all magmalake tins together.
[dependencies]
mojo-compiler = "==1.3.0.dev2026112505"
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "503a9c6d8fc5114f24a9e3355680a0024167bdb3" }
