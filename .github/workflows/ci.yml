name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true
      tools-ref: "release-check"

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      # The unit tests run in the stable / ubuntu-latest job below.
      task: ""
      tools-ref: "release-check"

  test:
    needs: release
    if: ${{ !cancelled() }}
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        env: ${{ fromJSON(needs.release.outputs.release_only == 'true' && '["stable"]' || '["default", "stable"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: arrow-mlake.mojo

      # The export block is built in a memory region, and the tests build
      # memory-region from source next door (`-I ../memory-region.mojo/src`).
      - uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          path: memory-region.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: the committed lock file is written by 0.78.0, and an
          # unpinned pixi rejects it as not up-to-date with the workspace.
          pixi-version: v0.78.0
          manifest-path: arrow-mlake.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Unit tests
        working-directory: arrow-mlake.mojo
        run: pixi run -e ${{ matrix.env }} test

      - name: Lint (mojolint --lsp)
        working-directory: arrow-mlake.mojo
        run: pixi run -e ${{ matrix.env }} lint

      - name: Lint tools (mojolint --lsp)
        working-directory: arrow-mlake.mojo
        run: pixi run -e ${{ matrix.env }} lint-tools

  pyarrow:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    # The cross-language gate: pyarrow *produces* the arrays and the stream,
    # this imports them, and the round-trip entry point re-exports so pyarrow
    # can compare what it gets back with what it sent. An importer checked only
    # against our own exporter would prove the two agree and nothing else.
    name: pyarrow parity / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: arrow-mlake.mojo

      # The export block is built in a memory region, and the tests build
      # memory-region from source next door (`-I ../memory-region.mojo/src`).
      - uses: actions/checkout@v4
        with:
          repository: magmalake/memory-region.mojo
          path: memory-region.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: arrow-mlake.mojo/pixi.toml
          environments: default

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Arrow C Data Interface out of pyarrow
        working-directory: arrow-mlake.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-c-import

      - name: ArrowArrayStream into pyarrow
        working-directory: arrow-mlake.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-c-stream

      - name: Arrow IPC streams, both ways with pyarrow
        working-directory: arrow-mlake.mojo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pixi run verify-ipc

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() }}
    needs: [release, release-check, test, pyarrow]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
